<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить сотрудника</title>
    <link rel="stylesheet" href="css/users.css">
    <link rel="icon" type="image/png" href="images/favicon-32x32.png" sizes="32x32">
</head>
<body>
<div class="container">
    <h1>Управление сотрудниками</h1>
    <!-- БЛОК НАВИГАЦИИ: Заголовок слева, кнопка справа -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600;"></h1>
        <a href="index.html" class="btn-home">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 9L12 2l9 7-4 4-9 7-9-7-4-4z"></path>
            </svg>
            На главную
        </a>
    </div>
    <div class="section">
        <h2>Добавить нового сотрудника</h2>
        <!-- Форма выведена напрямую в тело страницы -->
        <form id="createUserForm">
            <div class="form-group">
                <label for="surname">Фамилия:</label>
                <input type="text" id="surname" required placeholder="Иванов">
            </div>
            <div class="form-group">
                <label for="name">Имя:</label>
                <input type="text" id="name" required placeholder="Иван">
            </div>
            <button type="submit">Добавить</button>
        </form>
    </div>
    <div class="section">
        <h2>Список сотрудников</h2>
        <div id="users-container">
        <!-- Сюда будет вставлена таблица через JS -->
        </div>
    </div>
    <div id="message"></div>
</div>
<script src="js/users.js" defer></script>
</body>
</html>
