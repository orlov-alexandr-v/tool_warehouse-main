<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выдать инструмент</title>
    <link rel="stylesheet" href="css/tools.css">
    <link rel="icon" type="image/png" href="images/favicon-32x32.png" sizes="32x32">
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600;">Выдать инструмент</h1>
        <a href="index.html" class="btn-home">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 9L12 2l9 7-4 4-9 7-9-7-4-4z"></path>
            </svg>
            На главную
        </a>
    </div>
    <form id="issueForm" class="issue-form">
        <!-- 1. Выбор сотрудника -->
        <div class="form-group search-dropdown">
            <label for="userSelect">Сотрудник</label>
            <select id="userSelect" name="user_id" required>
                <option value="" disabled selected>Загрузка сотрудников...</option>
            </select>
        </div>
       <!-- 2. Выбор инструмента (с демоническим поиском) -->
        <div class="form-group search-dropdown">
            <label for="toolSearch">Инструмент (поиск по названию)</label>
            <input type="text" id="toolSearch" name="tool_search" placeholder="Введите название..." autocomplete="off" required>
            <!-- Контейнер для выпадающего списка -->
            <div id="toolSearchResults" class="search-results"></div>
        </div>
        <!-- Скрытое поле для ID инструмента (вынесено отдельно) -->
        <input type="hidden" id="selectedToolId" name="tool_id">
        <!-- 3. Выбор количества -->
        <div class="form-group full-width">
            <label for="quantityInput">Количество</label>
            <input type="number" id="quantityInput" name="quantity" min="1" value="1" required>
        </div>
        <div class="actions">
            <button type="submit" class="issue">Выдать инструмент</button>
            <button type="button" class="reset" id="resetFormBtn">Сбросить форму</button>
        </div>
    </form>
    <!-- Сообщения (ошибки/успех) -->
    <div id="message" class="status-message"></div>
</div>
<script src="js/tools.js" defer></script>
</body>
</html>
