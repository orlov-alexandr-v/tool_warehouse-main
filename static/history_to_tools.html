<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>История выдачи инструмента</title>
    <link rel="stylesheet" href="css/history.css">
    <link rel="icon" type="image/png" href="images/favicon-32x32.png" sizes="32x32">
</head>
<body>
<div class="container">
    <h1>История выдачи инструмента</h1>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0; font-size: 20px; font-weight: 500;">Фильтрация</h2>
        <a href="index.html" class="btn-home">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 9L12 2l9 7-4 4-9 7-9-7-4-4z"></path>
            </svg>
            На главную
        </a>
    </div>
    <!-- Блок поиска -->
    <div class="search-bar">
        <input type="text" id="searchUser" placeholder="Поиск по Фамилии...">
        <input type="text" id="searchTool" placeholder="Поиск по наименованию инструмента...">
        <button id="clearSearchBtn" class="btn-control secondary">Сброс</button>
    </div>
    <!-- Таблица истории -->
    <table id="historyTable">
        <thead>
        <tr>
            <th data-key="issue_date">Дата выдачи</th>
            <th data-key="user_fio">ФИ</th>
            <th data-key="tool_name">Наименование инструмента</th>
            <th data-key="quantity">Выдано, шт.</th>
        </tr>
        </thead>
        <tbody id="historyBody">
        <!-- Данные вставятся сюда через JS -->
        </tbody>
    </table>
    <!-- Сообщения -->
    <div id="message" class="status-message"></div>
    <!-- Пагинация -->
    <div id="pagination" class="pagination-controls">
        <button id="prevBtn" disabled>Назад</button>
        <span id="pageInfo"></span>
        <button id="nextBtn" disabled>Вперед</button>
    </div>
</div>
<script src="js/history.js" defer></script>
</body>
</html>
